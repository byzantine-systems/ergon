name: "[Nix] Build & Test"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: "[Lib] Check, Build and Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # nix-quick-install-action installs single-user as the runner user, so it
      # bails out if /nix is not writeable. nothing-but-nix creates /nix owned by
      # root, which suited the old DeterminateSystems installer (it runs under
      # sudo) but not this one, hence the permission edict.
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'cleave'
          nix-permission-edict: true

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # To leverage devenv inside Github Actions
      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      # TODO: Wait until sqruff properly supports GRAPH_TABLE (PG19)
      - name: "[Nix] Run treefmt to check Nix"
        run: |
          nix flake check

      - name: "[Nix] Build"
        run: |
          nix build

      # warnings_as_errors cannot live in the default profile: rebar3 compiles a
      # hex dependency with that dependency's own erl_opts, so shipping it would
      # let any new OTP warning break every downstream build. It lives in the
      # `check` profile instead, which makes the warning gate this explicit step
      # rather than a side effect of `nix build`.
      - name: "[Lint] Compile with warnings as errors"
        run: |
          nix develop --impure --command rebar3 as check compile

      # The devenv shell is the only working way to get PostgreSQL 19 with the
      # patched pg_cron and pgmq together: the official postgres image ships
      # none of the three, and nixpkgs' pg_cron does not compile against the
      # PG19 headers without the pin in flake.nix. So this is a devenv process
      # rather than a `services:` container.
      #
      # `--impure` because the shell reads PWD to locate its state directory.
      #
      # `--detached`, not `--detach`: devenv forwards these flags to
      # process-compose, which rejects the latter but leaves devenv exiting 0,
      # so a typo here starts nothing and still shows a green step.
      # Beware `-d`, which is process-compose's --hide-disabled; the short form
      # of --detached is -D.
      - name: "[DB] Start PostgreSQL"
        run: |
          nix develop --impure --command devenv up --detached

      # devenv reports the supervisor as up before postgres finishes its own
      # startup, and initdb on a cold runner is not instant. Poll the socket
      # rather than sleeping a guessed interval.
      - name: "[DB] Wait for readiness"
        run: |
          nix develop --impure --command bash -c '
            for i in $(seq 1 60); do
              if pg_isready -h 127.0.0.1 -p 5432 -q; then
                echo "ready after ${i}s"; exit 0
              fi
              sleep 1
            done
            echo "postgres did not become ready"; exit 1
          '

      # ergon_test_db:setup/0 creates and migrates ergon_test on first use, so
      # there is no separate migration step here. It is deliberately a different
      # database from the dev one: pg_cron can only be installed where
      # cron.database_name points, and running the suite without it is what
      # tests the guard in priv/migrations/bootstrap.
      - name: "[Test] Common Test"
        run: |
          nix develop --impure --command rebar3 ct

      - name: "[Test] Dialyzer"
        run: |
          nix develop --impure --command rebar3 dialyzer

      # The suite's own logs are the only useful artefact when a case fails on a
      # runner nobody can attach to.
      - name: "[Test] Upload logs"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ct-logs
          path: _build/test/logs/
          retention-days: 7
