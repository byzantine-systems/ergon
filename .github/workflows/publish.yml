name: "[Hex] Publish"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # nix-quick-install-action installs single-user as the runner user, so it
      # bails out if /nix is not writeable. nothing-but-nix creates /nix owned by
      # root, which suited the old DeterminateSystems installer (it runs under
      # sudo) but not this one, hence the permission edict.
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'cleave'
          nix-permission-edict: true

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # To leverage devenv inside Github Actions
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      # ex_doc renders the -moduledoc/-doc attributes (EEP-59) directly from
      # the compiled beams, so the docs are the module docs, not a second copy.
      #
      # Going through the rebar3_ex_doc plugin rather than calling the ex_doc
      # escript by hand, for three reasons.
      #
      # It works at all: `ex_doc` is not on the devShell PATH, so the direct
      # invocation this replaces could only ever have exited 127.
      #
      # It is the same input as hexdocs: the plugin reads the {ex_doc, ...}
      # block in rebar.config, which is what `hex publish` renders from in the
      # publish-to-hex job below. Hand-passing flags here meant Pages got
      # `--extra README.md` alone while hexdocs got all eight examples pages --
      # two doc sites, one tag, different contents.
      #
      # It derives the arguments this step used to compute: the app name and
      # ebin path come from the project, --source-ref from {vsn, ...} with a `v`
      # prefix (prefix_ref_vsn_with_v, default true), which is exactly the tag
      # that triggered this workflow -- so GITHUB_REF_NAME is no longer read,
      # and the vsn-scraping sed is gone. Output still lands in doc/.
      - name: "[Docs] Build the package's documentation"
        run: nix develop --impure --command rebar3 ex_doc

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-to-hex:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # rebar3_hex is fetched on demand rather than pinned in the devShell:
      # it is needed only here, and only on a version tag.
      - name: Publish to Hex
        run: nix develop --impure --command rebar3 as publish hex publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEXPM_API_KEY }}
